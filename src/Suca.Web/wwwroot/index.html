<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SUCA Minichat</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div>
          <h1>SUCA Minichat</h1>
          <p>Chat LLM minimal con RAG dinamico</p>
        </div>
      </div>

      <section class="panel">
        <div class="panel-head">
          <h2>Conversations</h2>
          <button id="new-chat-button" type="button">New</button>
        </div>
        <div id="conversation-list" class="conversation-list"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>LM Studio</h2>
          <button id="reload-models-button" type="button">Reload</button>
        </div>
        <label>Base URL
          <input id="base-url" type="text" autocomplete="off">
        </label>
        <label>Chat model
          <input id="chat-model" type="text" list="chat-model-list" autocomplete="off">
        </label>
        <label>Embedding model
          <input id="embedding-model" type="text" list="embedding-model-list" autocomplete="off">
        </label>
        <label>Temperature
          <input id="temperature" type="number" min="0" max="2" step="0.1">
        </label>
        <label>Max tokens
          <input id="max-tokens" type="number" min="64" max="4096" step="32">
        </label>
        <datalist id="chat-model-list"></datalist>
        <datalist id="embedding-model-list"></datalist>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>RAG</h2>
          <label class="toggle">
            <input id="rag-enabled" type="checkbox" checked>
            <span>Enabled</span>
          </label>
        </div>
        <label>Source directory
          <input id="source-directory" type="text" autocomplete="off">
        </label>
        <label>Semantic index path
          <input id="semantic-index-path" type="text" autocomplete="off">
        </label>
        <div class="grid-two">
          <label>Top K
            <input id="top-k" type="number" min="1" max="12" step="1">
          </label>
          <label>Attempts
            <input id="max-delivery-attempts" type="number" min="1" max="8" step="1">
          </label>
        </div>
        <div class="grid-two">
          <label>Chunk size
            <input id="chunk-size" type="number" min="200" max="4000" step="50">
          </label>
          <label>Chunk overlap
            <input id="chunk-overlap" type="number" min="0" max="800" step="10">
          </label>
        </div>
        <label class="toggle">
          <input id="recursive" type="checkbox" checked>
          <span>Recursive</span>
        </label>
        <label class="toggle">
          <input id="refresh-index" type="checkbox" checked>
          <span>Refresh index before query</span>
        </label>
      </section>
    </aside>

    <main class="chat">
      <header class="chat-head">
        <div>
          <h2 id="conversation-title">New Chat</h2>
          <p id="conversation-meta">No active conversation</p>
        </div>
        <div class="chat-actions">
          <button id="refresh-conversations-button" type="button">Refresh</button>
        </div>
      </header>

      <section id="message-list" class="message-list"></section>

      <section class="response-panel">
        <div class="response-head">
          <h3>Last response</h3>
          <span id="delivery-state" class="status-pill">Idle</span>
        </div>
        <pre id="response-summary" class="response-summary">Ready.</pre>
      </section>

      <form id="composer-form" class="composer">
        <textarea id="message-input" rows="4" placeholder="Write a message and press Send"></textarea>
        <div class="composer-actions">
          <span id="composer-status" class="composer-status">Idle</span>
          <button id="send-button" type="submit">Send</button>
        </div>
      </form>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
