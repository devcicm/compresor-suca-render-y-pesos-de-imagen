name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "ConsoleApp suca compress.csproj"

      - name: Build
        run: dotnet build "ConsoleApp suca compress.csproj" -c Release --nologo

  hygiene:
    name: Higiene del repositorio
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan (trufflehog)
        # Solo en pull_request: la accion compara BASE..HEAD y falla si no hay
        # commit base (por ejemplo, el primer push a un repositorio vacio).
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --only-verified

      - name: Secret scan del historial (primera subida)
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        shell: pwsh
        run: |
          git fetch --quiet --unshallow || git fetch --quiet --all
          $found = git log -p --all | Select-String -Pattern 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if ($found) {
            Write-Error "Posibles secretos en el historial: $($found.Count) coincidencia(s)."
            exit 1
          }
          Write-Host "Sin secretos evidentes en el historial."

      - name: Aviso de dependencias vulnerables (informativo)
        shell: pwsh
        run: |
          # No falla el build: deja constancia de las dependencias con avisos para
          # revisar en cada ejecucion. Ver SECURITY.md para el criterio de ImageSharp.
          dotnet list "ConsoleApp suca compress.csproj" package --vulnerable --include-transitive
          Write-Host "Fin del informe de vulnerabilidades (informativo)."

      - name: Verificar que no se versionan datos de runtime
        shell: pwsh
        run: |
          $tracked = git ls-files
          $forbidden = $tracked | Where-Object { $_ -like 'runtime/*' -or $_ -like '.playwright-mcp/*' -or $_ -like 'bin/*' -or $_ -like 'obj/*' -or $_ -like '*.env' -or $_ -like '*.key' -or $_ -like '*.pfx' }
          if ($forbidden) {
            Write-Error ("Archivos que no deben versionarse:`n" + ($forbidden -join "`n"))
            exit 1
          }
          Write-Host "OK: $($tracked.Count) archivos versionados, ninguno prohibido."

      - name: Aviso si la documentacion menciona el SPA con router
        shell: pwsh
        run: |
          $stale = Select-String -Path (Get-ChildItem -Recurse -Include *.md -File | Where-Object { $_.FullName -notmatch '\\(bin|obj|legacy|\.git)\\' }) -Pattern 'router por hash|router hash' -ErrorAction SilentlyContinue
          if ($stale) {
            Write-Warning "Hay referencias obsoletas al router por hash; el shell ahora es multipage."
            $stale | ForEach-Object { Write-Warning "  $($_.Path):$($_.LineNumber)" }
          }