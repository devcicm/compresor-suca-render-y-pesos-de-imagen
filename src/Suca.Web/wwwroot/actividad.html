<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actividad — SUCA Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231e6b52'/%3E%3Ctext x='16' y='23' font-size='18' font-family='Segoe UI' font-weight='700' text-anchor='middle' fill='%23f5f3ed'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/studio/css/suca-ui.css">
</head>
<body data-page="actividad" data-title="Actividad" data-subtitle="Ordenes y eventos de trazabilidad">
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <aside class="svc-nav" id="svc-nav" aria-label="Servicios SUCA"></aside>
  <div class="svc-backdrop" id="nav-backdrop" hidden></div>

  <main class="svc-main" id="main">
    <header class="svc-topbar">
      <button class="svc-burger" id="nav-burger" type="button" aria-label="Abrir menu">&#9776;</button>
      <h1 id="view-title"></h1>
      <span id="view-subtitle" class="svc-topbar-sub"></span>
    </header>

    <div class="card">
      <div class="card-head">
        <h2>Ordenes orquestadas
          <span class="tip-dot" data-tip-title="Ordenes" data-tip="Lotes enviados via JSON (POST /api/web/orders) o consola. Pausa/reanuda/cancela desde aqui." tabindex="0" role="note">?</span>
        </h2>
        <button id="refresh-activity-button" type="button" class="btn">Actualizar</button>
      </div>
      <div id="orders-list" class="orders-list"></div>
      <p class="muted-note">Pulsa el identificador de una orden para ver sus items, su historial de estados y descargar su JSON.</p>
    </div>

    <div class="card">
      <h2>Eventos recientes (trazabilidad)</h2>
      <div class="btn-row activity-toolbar">
        <label class="field field-inline">
          <span class="field-label">Filtrar</span>
          <input id="activity-filter" type="search" placeholder="correlationId, nombre de evento...">
        </label>
        <div class="view-toggles" role="group" aria-label="Vista de eventos">
          <button id="events-table-view" type="button" class="btn" data-active="true" aria-pressed="true">Tabla</button>
          <button id="events-timeline-view" type="button" class="btn" aria-pressed="false">Timeline
            <span class="tip-dot" data-tip-title="Timeline" data-tip="Agrupa los eventos por correlacion y dibuja cada trabajo como una barra: inicio, duracion y estado. Ideal para ver donde se fue el tiempo de una orden." data-tip-pos="top" tabindex="0" role="note">?</span>
          </button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="activity-table">
          <thead><tr><th>Hora</th><th>Nivel</th><th>Evento</th><th>Mensaje</th><th>Correlacion</th></tr></thead>
          <tbody id="activity-rows"></tbody>
        </table>
      </div>
      <div id="activity-timeline" class="timeline" hidden></div>
    </div>
  </main>

  <div id="order-detail-overlay" class="overlay" hidden>
    <div class="card detail-card">
      <header class="card-head">
        <h3 id="order-detail-title">Detalle de la orden</h3>
        <div class="btn-row">
          <a id="order-detail-download" class="btn" download>Descargar JSON</a>
          <button id="order-detail-close" type="button" class="btn">Cerrar</button>
        </div>
      </header>
      <div id="order-detail-meta" class="chip-row"></div>
      <div id="order-detail-items" class="order-items"></div>
    </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="/studio/js/main.js"></script>
  <script type="module" src="/studio/js/pages/actividad.js"></script>
</body>
</html>
